<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gorillaz JAM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo" aria-label="Lineup color reveal demo">
        <section class="image-stage" aria-hidden="true">
            <div class="lineup-frame">
                <div class="lineup-layer lineup-layer--gray"></div>
                <div class="lineup-layer lineup-layer--color slice" data-sector="1"></div>
                <div class="lineup-layer lineup-layer--color slice" data-sector="2"></div>
                <div class="lineup-layer lineup-layer--color slice" data-sector="3"></div>
                <div class="lineup-layer lineup-layer--color slice" data-sector="4"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
